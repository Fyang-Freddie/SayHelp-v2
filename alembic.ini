[alembic]
script_location = alembic
prepend_sys_path = .
# Actual URL is read from app.config.settings.database_url in alembic/env.py.
# This is a placeholder only; do not commit real credentials.
sqlalchemy.url = mysql+pymysql://sayhelp:CHANGE_ME@127.0.0.1:3307/sayhelp?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
